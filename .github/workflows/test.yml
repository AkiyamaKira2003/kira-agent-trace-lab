name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Sample trace evaluation
        run: python -m agent_trace_lab evaluate examples/suite.json --format json
      - name: Aggregate-only caller-label summary without trace details
        run: |
          python -m agent_trace_lab evaluate examples/suite.json --summary-only --format json
          python -m agent_trace_lab evaluate examples/suite.json --summary-only --format text
      - name: Explicit task authorization suite
        run: python -m agent_trace_lab evaluate examples/task_grants.json --format json
      - name: Compare identical recorded cases under two policies
        run: |
          python -m agent_trace_lab compare-policies examples/demo_permissive.json --candidate-policy examples/compare_candidate_task_guarded.json --format json
          python -m agent_trace_lab compare-policies examples/demo_permissive.json --candidate-policy examples/compare_candidate_task_guarded.json --format json --redact-case-ids
      - name: OpenTelemetry import and evaluation
        run: |
          python -m agent_trace_lab import-otlp examples/otlp_spans.json --policy-suite examples/suite.json --case-id ci_trace --expected allow --output artifacts/ci_trace.json
          python -m agent_trace_lab evaluate artifacts/ci_trace.json
      - name: Synthetic SWE tool-call import and evaluation
        run: |
          python -m agent_trace_lab import-swe examples/swe_recorded_row_synthetic.json --policy-suite examples/swe_structural_policy.json --case-id ci_swe_trace --expected allow --output artifacts/ci_swe_trace.json
          python -m agent_trace_lab evaluate artifacts/ci_swe_trace.json
      - name: Synthetic AgentDojo tool-call import and evaluation
        run: |
          python -m agent_trace_lab import-agentdojo examples/agentdojo_recorded_synthetic.json --policy-suite examples/agentdojo_policy_simulated_scope.json --case-id ci_dojo_trace --expected allow --output artifacts/ci_dojo_trace.json
          python -m agent_trace_lab evaluate artifacts/ci_dojo_trace.json
      - name: Synthetic OpenAI Responses function-call import and evaluation
        run: |
          python -m agent_trace_lab import-responses examples/responses_function_calls_synthetic.json --policy-suite examples/suite.json --case-id ci_responses_trace --expected allow --output artifacts/ci_responses_trace.json
          python -m agent_trace_lab evaluate artifacts/ci_responses_trace.json
      - name: Build project wheel with isolated declared build backend
        run: python -m pip wheel --no-deps --wheel-dir artifacts/ci-wheel .
      - name: Verify isolated wheel import, offline CLI, and package boundary
        run: python -m scripts.verify_installed_wheel --wheel-dir artifacts/ci-wheel
      - name: Verify source archive and wheel rebuilt from that archive
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build --sdist --outdir artifacts/ci-sdist .
          python -m scripts.verify_source_sdist --sdist-dir artifacts/ci-sdist
          python -m scripts.wheel_from_sdist --sdist-dir artifacts/ci-sdist --wheel-dir artifacts/ci-sdist-wheel
          python -m scripts.verify_installed_wheel --wheel-dir artifacts/ci-sdist-wheel
      - name: Verify two source-date-pinned wheel builds match on this runner
        run: python -m scripts.verify_reproducible_wheel
